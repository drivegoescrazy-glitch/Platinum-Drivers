name: Build and release Platinum v1

on:
  push:
    branches:
      - platinum-v1
    paths:
      - 'build_turnip.sh'
      - '.github/workflows/platinum-v1.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      - '8g2_ui_glitch.patch'
      - '39751.patch'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      mesa_commit: ${{ steps.mesa.outputs.commit }}
    steps:
      - name: Resolve one Mesa revision for this release
        id: mesa
        run: |
          COMMIT="$(git ls-remote https://gitlab.freedesktop.org/mesa/mesa.git refs/heads/main | awk '{print $1}')"
          test -n "$COMMIT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "Building against Mesa $COMMIT"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: a7xx
            artifact: Platinum-v1-A7xx
          - variant: a7xx-oneui
            artifact: Platinum-v1-A7xx-OneUI
    steps:
      - name: Checkout Platinum v1 source
        uses: actions/checkout@v4
        with:
          ref: platinum-v1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip patch clang lld llvm
          pip3 install --break-system-packages meson mako

      - name: Build ${{ matrix.artifact }}
        env:
          VARIANT: ${{ matrix.variant }}
          BUILD_VERSION: 1.0
          PLATINUM_OPTIMIZED: 1
          MESA_COMMIT: ${{ needs.resolve.outputs.mesa_commit }}
        run: |
          chmod +x build_turnip.sh
          ./build_turnip.sh

      - name: Verify driver package
        run: |
          ZIP="$(find turnip_workdir -maxdepth 1 -type f -name 'Turnip_Platinum-*.zip' -print -quit)"
          test -n "$ZIP"
          unzip -t "$ZIP"
          unzip -p "$ZIP" meta.json | python3 -m json.tool
          echo "Verified $ZIP"

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: turnip_workdir/Turnip_Platinum-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: [resolve, build]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download both build packages
        uses: actions/download-artifact@v4
        with:
          pattern: Platinum-v1-*
          path: release
          merge-multiple: true

      - name: Check release contents
        run: |
          ls -lah release
          test "$(find release -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 2
          for f in release/*.zip; do unzip -t "$f"; done

      - name: Publish Platinum v1 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: platinum-v1.0
          name: Platinum Drivers v1.0
          body: |
            ## Platinum v1.0

            Built from the v39 source baseline and one pinned Mesa revision:
            ${{ needs.resolve.outputs.mesa_commit }}

            ### Packages
            - **Platinum-A7xx** — standard A7xx Android/Bionic build.
            - **Platinum-A7xx-OneUI** — A7xx build with the inherited OneUI 8g2 UI glitch patch.

            ### Changelog
            - Retains the v39 A7xx device configuration and D32S8 workaround revert.
            - Uses Mesa release optimisation level 3 and NDEBUG; LTO is deliberately disabled because Mesa explicitly rejects LTO as unsupported.
            - Explicitly selects Mesa release optimisation level 3 and NDEBUG.
            - Keeps upstream GMEM, UBWC, shader and memory behaviour unchanged; no speculative cache sizing, forced sysmem, clock or thermal overrides.
            - Uses one pinned Mesa commit for both packages in this release.

            ### Testing status
            - Both ZIP archives are structurally verified during CI.
            - These packages have not yet passed on-device Vulkan CTS, visual regression and sustained thermal testing. This is an initial test release, not a claim of proven higher FPS or lower temperatures.
          files: release/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
