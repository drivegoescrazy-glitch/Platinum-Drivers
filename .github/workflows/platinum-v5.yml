name: Build and release Platinum v5

on:
  push:
    branches:
      - platinum-v5
    paths:
      - 'build_turnip.sh'
      - '.github/workflows/platinum-v5.yml'
      - 'README.md'
      - 'CHANGELOG.md'
      - '8g2_ui_glitch.patch'
      - 'patches/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: a7xx
            artifact: Platinum-v5-A7xx
          - variant: a7xx-oneui
            artifact: Platinum-v5-A7xx-OneUI
    steps:
      - name: Checkout Platinum v5 source
        uses: actions/checkout@v4
        with:
          ref: platinum-v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf unzip flex bison git perl python3-pip glslang-tools curl zip patch clang lld llvm
          pip3 install --break-system-packages meson mako

      - name: Build ${{ matrix.artifact }}
        env:
          VARIANT: ${{ matrix.variant }}
          BUILD_VERSION: 5.0
          PLATINUM_OPTIMIZED: 1
          PLATINUM_V5_NO_PLT: 1
          # Pin current upstream Mesa main used by Banners-Turnip v27.0.0-20261111-r3.
          MESA_COMMIT: 20a455bed795148c07a3adc3eed1e84c5ed4a785
        run: |
          chmod +x build_turnip.sh
          ./build_turnip.sh

      - name: Verify v4 compile flags and package
        run: |
          ZIP="$(find turnip_workdir -maxdepth 1 -type f -name 'Turnip_Platinum-*.zip' -print -quit)"
          test -n "$ZIP"
          unzip -t "$ZIP"
          unzip -p "$ZIP" meta.json | python3 -m json.tool
          unzip -Z1 "$ZIP" | grep -Fxq 'libvulkan_freedreno.so'
          unzip -Z1 "$ZIP" | grep -Fxq 'meta.json'
          test "$(git -C turnip_workdir/mesa rev-parse HEAD)" = "$MESA_COMMIT"
          grep -Fq 'gmem_bandwidth = (gmem_bandwidth * 10 + total_draw_call_bandwidth) / 10;' turnip_workdir/mesa/src/freedreno/vulkan/tu_autotune.cc
          grep -Fq 'kgsl_poll_timestamp(fd, context_id, timestamp)' turnip_workdir/mesa/src/freedreno/vulkan/tu_knl_kgsl.cc
          grep -Fq 'kgsl_syncobj_merge(struct tu_device *device' turnip_workdir/mesa/src/freedreno/vulkan/tu_knl_kgsl.cc
          if ninja -C turnip_workdir/mesa/build-android-aarch64 -t commands | grep -F -- '-flto' >/dev/null; then
            echo "Unexpected LTO flag in V5 build" >&2
            exit 1
          fi
          echo "Verified $ZIP"

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: turnip_workdir/Turnip_Platinum-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: build
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download both build packages
        uses: actions/download-artifact@v4
        with:
          pattern: Platinum-v5-*
          path: release
          merge-multiple: true

      - name: Check release contents
        run: |
          ls -lah release
          test "$(find release -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 2
          for f in release/*.zip; do
            unzip -t "$f"
            unzip -p "$f" meta.json | python3 -m json.tool
          done

      - name: Publish Platinum v5 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: platinum-v5.0
          name: Platinum Drivers v5.0
          body: |
            ## Platinum v5.0 — current upstream Mesa + balanced A7xx tuning

            Built from upstream Mesa main commit `20a455bed795148c07a3adc3eed1e84c5ed4a785`, the source used by Banners-Turnip v27.0.0-20261111-r3.

            ### Packages
            - **Platinum-A7xx** — standard Adreno 7xx build for the AYN Thor Base / Adreno 740.
            - **Platinum-A7xx-OneUI** — same build with the Adreno 740 TP UBWC hint enabled; use only if the system firmware requires it to avoid UI flicker/corruption.

            ### Changes from v4
            - Moves from the older pinned Mesa source to current upstream Mesa 27.0.0 main.
            - Drops v1-era local D32S8 revert and old gen1 preamble override; current upstream A7xx device descriptors are used unchanged.
            - Adds upstream KGSL zero-timeout polling and syncobj-merge assertions; CI fails if either fix is missing.
            - Adds per-game A7xx SSBO emulation defaults for MIO and UNCHARTED: Legacy of Thieves Collection.
            - Adds WinNative's balanced GMEM bandwidth-estimate adjustment (11/10 to 10/10); does not force GMEM or SYSMEM.
            - Keeps standard KGSL power management. No PWR_MAX clock forcing, no governor override, no voltage/clock changes, no ThinLTO.
            - Uses the idempotent Adreno 740 OneUI UBWC-hint patch for the compatibility package.

            ### Performance and power
            This combines a current upstream driver with a conservative balanced autotuner profile. The intent is better GMEM/SYSMEM selection and less unnecessary bandwidth, while retaining normal dynamic GPU power management. It is not a guarantee of higher FPS, lower temperatures or longer battery life; those require repeatable tests on an Adreno 740 device.

            ### CI validation
            - Both variants must compile and pass ZIP/metadata verification.
            - CI checks the pinned Mesa SHA, balanced autotuner expression, both upstream KGSL fixes, and absence of LTO flags.
            - No forced clock, voltage, thermal, GMEM or SYSMEM settings are included.
          files: release/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
